version: '3.8'

services:
  # MySQL база данных
  db:
    image: mysql:9.0
    container_name: shop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Ваше ASP.NET Core приложение
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_web
    restart: always
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=server=db;port=3306;database=shopdb;user=shopuser;password=shoppassword;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  mysql_data: